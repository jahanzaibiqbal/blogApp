    <!-- Edit Form (Initially Hidden) -->
    <div id="edit-form" style="display: none;">
        <h3>Edit Blog Post</h3>
        <input type="text" id="edit-title" placeholder="Title">
        <textarea id="edit-desc" placeholder="Description"></textarea>
        <label>
            <input type="checkbox" id="edit-private"> Is Private

        <button onclick="document.getElementById('edit-form').style.display = 'none';">Cancel</button>
    </div>
